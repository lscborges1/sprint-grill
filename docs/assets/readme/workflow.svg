<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-labelledby="workflow-title workflow-description" style="width: 100%; max-width: 960px; height: auto">
  <title id="workflow-title">Fluxo do Refina: Investigar, Refinar, Revisar e Publicar</title>
  <desc id="workflow-description">Quatro etapas conectadas em sequência, da investigação da User Story à publicação dos artefatos aprovados.</desc>
  <style>
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .number { fill: #0969da; }
    .number-text { fill: #ffffff; }
    .label { fill: #1f2328; }
    .arrow { fill: none; stroke: #57606a; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .number { fill: #58a6ff; }
      .number-text { fill: #0d1117; }
      .label { fill: #f0f6fc; }
      .arrow { stroke: #8b949e; }
    }
  </style>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(20 52)">
      <rect class="card" width="200" height="96" rx="16" stroke-width="2" />
      <circle class="number" cx="42" cy="48" r="20" />
      <text class="number-text" x="42" y="54" font-size="18" font-weight="700" text-anchor="middle">1</text>
      <text class="label" x="76" y="56" font-size="22" font-weight="650">Investigar</text>
    </g>

    <path class="arrow" d="M226 100h18m-7-8 8 8-8 8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <g transform="translate(250 52)">
      <rect class="card" width="200" height="96" rx="16" stroke-width="2" />
      <circle class="number" cx="42" cy="48" r="20" />
      <text class="number-text" x="42" y="54" font-size="18" font-weight="700" text-anchor="middle">2</text>
      <text class="label" x="76" y="56" font-size="22" font-weight="650">Refinar</text>
    </g>

    <path class="arrow" d="M456 100h18m-7-8 8 8-8 8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <g transform="translate(480 52)">
      <rect class="card" width="200" height="96" rx="16" stroke-width="2" />
      <circle class="number" cx="42" cy="48" r="20" />
      <text class="number-text" x="42" y="54" font-size="18" font-weight="700" text-anchor="middle">3</text>
      <text class="label" x="76" y="56" font-size="22" font-weight="650">Revisar</text>
    </g>

    <path class="arrow" d="M686 100h18m-7-8 8 8-8 8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <g transform="translate(710 52)">
      <rect class="card" width="230" height="96" rx="16" stroke-width="2" />
      <circle class="number" cx="42" cy="48" r="20" />
      <text class="number-text" x="42" y="54" font-size="18" font-weight="700" text-anchor="middle">4</text>
      <text class="label" x="76" y="56" font-size="22" font-weight="650">Publicar</text>
    </g>
  </g>
</svg>
